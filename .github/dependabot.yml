# Propõe PRs atualizando as actions (fixadas por SHA no workflow) e os módulos
# Go. Os PRs vão para a development, como o resto do fluxo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    schedule:
      interval: weekly
